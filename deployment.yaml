apiVersion: apps/v1
kind: Deployment

metadata:
  name: qr-code-generator

spec:
  replicas: 2

  selector:
    matchLabels:
      app: qr-code-generator

  template:
    metadata:
      labels:
        app: qr-code-generator

    spec:
      containers:
        - name: qr-code-generator

          image: dhirajpatil2757/qr-code-generator:1.0

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

---

apiVersion: v1
kind: Service

metadata:
  name: qr-code-generator-service

spec:
  type: NodePort

  selector:
    app: qr-code-generator

  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080